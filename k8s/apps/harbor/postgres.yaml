apiVersion: v1
kind: Secret
metadata:
  name: harbor-db-credentials
  namespace: harbor
type: kubernetes.io/basic-auth
stringData:
  username: harbor
  password: HarborPostgres2026!
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-postgres
  namespace: harbor
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.8
  primaryUpdateStrategy: unsupervised
  storage:
    size: 5Gi
    storageClass: standard
  bootstrap:
    initdb:
      database: registry
      owner: harbor
      secret:
        name: harbor-db-credentials
