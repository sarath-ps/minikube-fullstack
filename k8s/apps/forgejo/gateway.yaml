apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: forgejo
  namespace: forgejo
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: forgejo.192.168.39.201.nip.io
      allowedRoutes:
        namespaces:
          from: Same

    - name: https
      protocol: HTTPS
      port: 443
      hostname: forgejo.192.168.39.201.nip.io
      tls:
        mode: Terminate
        certificateRefs:
          - name: forgejo-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Same

    - name: ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
spec:
  parentRefs:
    - name: forgejo
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: forgejo
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: forgejo-ssh
  namespace: forgejo
spec:
  parentRefs:
    - name: forgejo
      sectionName: ssh
  rules:
    - backendRefs:
        - name: forgejo
          port: 2222
