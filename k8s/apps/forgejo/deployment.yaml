apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
    spec:
      initContainers:
        - name: wait-for-postgres
          image: ghcr.io/cloudnative-pg/postgresql:16.8
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until pg_isready -h forgejo-postgres-rw.forgejo.svc -p 5432 -U forgejo; do
                echo "PostgreSQL is not ready yet, sleeping 2s..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-app
                  key: password
      containers:
        - name: forgejo
          image: code.forgejo.org/forgejo/forgejo:10.0.1
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: FORGEJO__DEFAULT__APP_NAME
              value: "Cloudsea Forgejo"
            - name: FORGEJO__DEFAULT__RUN_MODE
              value: "prod"
            - name: FORGEJO__server__DOMAIN
              value: "forgejo.192.168.39.200.nip.io"
            - name: FORGEJO__server__ROOT_URL
              value: "https://forgejo.192.168.39.200.nip.io/"
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            - name: FORGEJO__server__SSH_PORT
              value: "22"
            - name: FORGEJO__server__SSH_LISTEN_PORT
              value: "2222"
            - name: FORGEJO__server__START_SSH_SERVER
              value: "true"
            - name: FORGEJO__database__DB_TYPE
              value: "postgres"
            - name: FORGEJO__database__HOST
              value: "forgejo-postgres-rw:5432"
            - name: FORGEJO__database__NAME
              value: "forgejo"
            - name: FORGEJO__database__USER
              value: "forgejo"
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-app
                  key: password
            - name: FORGEJO__database__SSL_MODE
              value: "disable"
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: secret-key
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "false"
            - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
              value: "false"
            - name: FORGEJO__actions__ENABLED
              value: "true"
            - name: FORGEJO_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin-secret
                  key: username
            - name: FORGEJO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin-secret
                  key: password
            - name: FORGEJO_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin-secret
                  key: email
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    (
                      update-ca-certificates || true
                      sleep 5
                      su-exec git forgejo admin user create --admin --username "$FORGEJO_ADMIN_USER" --password "$FORGEJO_ADMIN_PASSWORD" --email "$FORGEJO_ADMIN_EMAIL" --must-change-password=false || true
                      su-exec git forgejo admin auth add-oauth --name Authentik --provider openidConnect --key forgejo --secret forgejo-authentik-secret-2026 --auto-discover-url https://authentik.192.168.39.200.nip.io/application/o/forgejo/.well-known/openid-configuration || true
                    ) &
          volumeMounts:
            - name: data
              mountPath: /data
            - name: root-ca
              mountPath: /usr/local/share/ca-certificates/cloudsea-root-ca.crt
              subPath: cloudsea-root-ca.crt
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
        - name: root-ca
          configMap:
            name: cloudsea-root-ca
