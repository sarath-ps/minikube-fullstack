apiVersion: batch/v1
kind: Job
metadata:
  name: garage-init-layout
  namespace: garage
spec:
  template:
    metadata:
      name: garage-init-layout
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: dxflrs/garage:v1.1.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for garage-0 to be ready..."
              until /garage -h garage-0.garage-headless.garage.svc.cluster.local:3901 status >/dev/null 2>&1; do
                sleep 2
              done
              echo "Connected to garage-0!"

              NODE_ID=$(/garage -h garage-0.garage-headless.garage.svc.cluster.local:3901 status | grep -E '^[0-9a-f]{16}' | awk '{print $1}' | head -n 1)
              echo "Found Node ID: $NODE_ID"

              if [ -n "$NODE_ID" ]; then
                if /garage -h garage-0.garage-headless.garage.svc.cluster.local:3901 status | grep -q "NO ROLE ASSIGNED"; then
                  echo "Assigning layout..."
                  /garage -h garage-0.garage-headless.garage.svc.cluster.local:3901 layout assign -z minikube -c 50G "$NODE_ID"
                  /garage -h garage-0.garage-headless.garage.svc.cluster.local:3901 layout apply --version 1
                  echo "Layout applied successfully!"
                else
                  echo "Node already has a role assigned."
                fi
              fi
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: rpc-secret
