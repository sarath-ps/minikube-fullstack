apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1

    [rpc]
    bind_addr = "[::]:3901"
    rpc_secret_file = "/etc/garage/secrets/rpc-secret"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.192.168.39.202.nip.io"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.192.168.39.202.nip.io"
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token_file = "/etc/garage/secrets/admin-token"
