apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-ui-config
  namespace: garage
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      environment: "production"
      domain: "garage.192.168.39.200.nip.io"
      root_url: "https://garage.192.168.39.200.nip.io"

    garage:
      endpoint: "http://garage.garage.svc:3900"
      region: "garage"
      admin_endpoint: "http://garage.garage.svc:3903"
      admin_token: "d71afbc926da6762fb341b4ba9de8f7100d61e0f2f0eee98401a56ec955b6eae"

    auth:
      admin:
        enabled: true
        username: "admin"
        password: "AdminGarage2026!"
      token:
        enabled: true
      oidc:
        enabled: true
        provider_name: "Authentik"
        client_id: "garage-ui"
        client_secret: "garage-authentik-secret-2026"
        issuer_url: "https://authentik.192.168.39.200.nip.io/application/o/garage-ui/"
        skip_issuer_check: true
        scopes:
          - openid
          - email
          - profile
        email_attribute: "email"
        username_attribute: "preferred_username"
        name_attribute: "name"
        role_attribute_path: "groups"
        admin_roles:
          - "authentik Admins"
          - "akadmin"
          - "admin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-ui
  namespace: garage
  labels:
    app.kubernetes.io/name: garage-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-ui
    spec:
      containers:
        - name: garage-ui
          image: noooste/garage-ui:latest
          command:
            - ./garage-ui
            - -config
            - /app/config/config.yaml
          env:
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/cloudsea-root-ca.crt
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
            - name: root-ca
              mountPath: /etc/ssl/certs/cloudsea-root-ca.crt
              subPath: cloudsea-root-ca.crt
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: garage-ui-config
        - name: root-ca
          configMap:
            name: cloudsea-root-ca
---
apiVersion: v1
kind: Service
metadata:
  name: garage-ui
  namespace: garage
  labels:
    app.kubernetes.io/name: garage-ui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: garage-ui
