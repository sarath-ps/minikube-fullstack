apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-webui
  namespace: garage
  labels:
    app.kubernetes.io/name: garage-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-webui
    spec:
      containers:
        - name: webui
          image: khairul169/garage-webui:latest
          ports:
            - name: http
              containerPort: 3909
          env:
            - name: API_BASE_URL
              value: "http://garage.garage.svc:3903"
            - name: API_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: admin-token
            - name: S3_ENDPOINT_URL
              value: "https://s3.192.168.39.202.nip.io"
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: garage-config
---
apiVersion: v1
kind: Service
metadata:
  name: garage-webui
  namespace: garage
  labels:
    app.kubernetes.io/name: garage-webui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3909
      targetPort: 3909
  selector:
    app.kubernetes.io/name: garage-webui
