apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      volumes:
        - name: dind-storage
          emptyDir: {}
        - name: runner-data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: runner-config
          configMap:
            name: forgejo-runner-config
      containers:
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          args:
            - dockerd
            - --host=tcp://0.0.0.0:2375
            - --tls=false
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi

        - name: runner
          image: data.forgejo.org/forgejo/runner:6.2.2
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Docker daemon on 127.0.0.1:2375..."
              until nc -z 127.0.0.1 2375; do
                sleep 1
              done
              echo "Docker daemon is ready!"

              cd /data
              if [ ! -f .runner ]; then
                echo "Registering Forgejo runner..."
                forgejo-runner register \
                  --no-interactive \
                  --instance "$FORGEJO_INSTANCE_URL" \
                  --token "$FORGEJO_RUNNER_TOKEN" \
                  --name "$RUNNER_NAME" \
                  --labels "ubuntu-latest:docker://node:20-bookworm,ubuntu-22.04:docker://node:20-bookworm,alpine:docker://alpine:latest,docker:docker://node:20-bookworm"
              fi

              echo "Starting Forgejo runner daemon..."
              exec forgejo-runner daemon --config /etc/forgejo-runner/config.yaml
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
            - name: FORGEJO_INSTANCE_URL
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: instance-url
            - name: FORGEJO_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: token
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /etc/forgejo-runner
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
