apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  system-oauth-apps.yaml: |
    version: 1
    metadata:
      name: Platform Applications SSO
      labels:
        blueprints.goauthentik.io/system: "true"
    entries:
      # Argo CD OAuth2 Provider
      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        identifiers:
          name: argocd
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          issuer_mode: per_provider
          client_id: argocd
          client_secret: argocd-authentik-secret-2026
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.192.168.39.200.nip.io/auth/callback
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      # Argo CD Application
      - model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: Argo CD
          provider: !KeyOf argocd-provider

      # Forgejo OAuth2 Provider
      - model: authentik_providers_oauth2.oauth2provider
        id: forgejo-provider
        identifiers:
          name: forgejo
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          issuer_mode: per_provider
          client_id: forgejo
          client_secret: forgejo-authentik-secret-2026
          redirect_uris:
            - matching_mode: strict
              url: https://forgejo.192.168.39.200.nip.io/user/oauth2/authentik/callback
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      # Forgejo Application
      - model: authentik_core.application
        identifiers:
          slug: forgejo
        attrs:
          name: Forgejo
          provider: !KeyOf forgejo-provider

      # Garage UI OAuth2 Provider
      - model: authentik_providers_oauth2.oauth2provider
        id: garage-ui-provider
        identifiers:
          name: garage-ui
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          issuer_mode: per_provider
          client_id: garage-ui
          client_secret: garage-authentik-secret-2026
          redirect_uris:
            - matching_mode: strict
              url: https://garage.192.168.39.200.nip.io/auth/oidc/callback
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
            - refresh_token
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      # Garage UI Application
      - model: authentik_core.application
        identifiers:
          slug: garage-ui
        attrs:
          name: Garage UI
          provider: !KeyOf garage-ui-provider
