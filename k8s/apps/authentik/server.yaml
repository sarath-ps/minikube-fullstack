apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: ghcr.io/goauthentik/server:2026.8.1
          args:
            - server
          envFrom:
            - secretRef:
                name: authentik-secrets
          ports:
            - name: http
              containerPort: 9000
            - name: https
              containerPort: 9443
            - name: metrics
              containerPort: 9300
          volumeMounts:
            - name: blueprints
              mountPath: /blueprints/custom
          startupProbe:
            httpGet:
              path: /-/health/live/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
      volumes:
        - name: blueprints
          configMap:
            name: authentik-blueprints
