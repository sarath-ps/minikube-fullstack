            "w": 12,
            "x": 0,
            "y": 15
          },
          "id": 11,
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right"
            }
          },
          "targets": [
            {
              "expr": "sum by (namespace) (rate(container_network_receive_bytes_total[5m]))",
              "legendFormat": "{{namespace}} (Rx)",
              "refId": "A"
            }
          ],
          "title": "Network Ingress (Rx) by Namespace",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "lineWidth": 2
