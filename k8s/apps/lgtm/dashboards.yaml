            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "id": 10,
          "title": "Cluster Network IO",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "fieldConfig": {
